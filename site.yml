# mdsite configuration
site_name: Simulation Workshop
site_description: My learnings and teachings on Modelica and system simulation.
site_url: ""                 # set for canonical links, e.g. https://docs.acme.dev
docs_dir: docs
site_dir: site
use_directory_urls: false    # false: guide/page.html (opens from disk) | true: guide/page/
copyright: "simulationworkshop"
show_updated: false          # show "Last updated" from each file's modified time

# repo_url: https://github.com/acme/docs
# edit_uri: edit/main/docs/  # adds an "Edit this page" link when repo_url is set

theme:
  primary: "#00796b"         # accent color (light mode)
  primary_dark: "#3ddbc0"    # accent color (dark mode)
  default_mode: auto         # auto | light | dark
  code_light: xcode          # any pygments style
  code_dark: github-dark
  expand_all: false          # open every nav section by default
  fonts: true                # false = system fonts only (no Google Fonts request)
  # logo: assets/logo.svg    # optional image next to the site name

# Navigation: this is the layout of the site. Remove `nav` to generate it
# automatically from the docs/ folder structure.
nav:
  - Home: index.md
  - Modelica Tutorials:
      - Installation: Modelica-tutorials/Video-Tutorials.md
      - Configuration: Modelica-tutorials/Video-Tutorials.md
  - System Simulation:
      - Introduction to system simulation: systemsimulation/systemsimulation.md
      - Other articles on Technology and Simulation: systemsimulation/OtherArticles.md
  - About Me: About/AboutMe.md

# Files in docs/ named .* or _* are never published (use _snippets/ for partials).
# exclude_docs: ["drafts/*"]

# extra_css: [assets/custom.css]
# extra_javascript: [assets/custom.js]

# Any Python-Markdown extension, with optional settings:
# markdown_extensions:
#   - pymdownx.tabbed: {alternate_style: true}
