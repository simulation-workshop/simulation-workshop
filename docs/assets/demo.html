<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Counter demo</title>
<style>
  body { margin: 0; height: 100vh; display: grid; place-items: center; font-family: system-ui, sans-serif; background: #f4f5fb; color: #1f2430; }
  .box { text-align: center; }
  #n { font-size: 3rem; font-weight: 700; margin: 0 0 .5rem; }
  button { font: inherit; padding: .5rem 1.1rem; border: 0; border-radius: 8px; background: #4f46e5; color: #fff; cursor: pointer; }
  button:hover { background: #4338ca; }
</style>
</head>
<body>
  <div class="box">
    <p id="n">0</p>
    <button id="b">Click me</button>
  </div>
  <script>
    var n = 0;
    document.getElementById('b').onclick = function () { document.getElementById('n').textContent = ++n; };
  </script>
</body>
</html>
